# Local stack: `docker compose up --build`
# Website: http://localhost:8080 · SMTP for test mails: localhost:2525
name: e-mail-check

networks:
  mail:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  data:
  umami-db:

services:
  unbound:
    build: infra/unbound
    restart: unless-stopped
    networks:
      mail:
        ipv4_address: 172.28.0.53

  rspamd:
    image: rspamd/rspamd:4.2@sha256:47e00f62105f8a60009a30a590ebcf3bfd0b992d45468222d34afa5ca2103690
    restart: unless-stopped
    volumes:
      - ./infra/rspamd/local.d:/etc/rspamd/local.d:ro
    depends_on: [unbound]
    networks: [mail]

  engine:
    build:
      context: .
      dockerfile: apps/engine/Dockerfile
    restart: unless-stopped
    environment:
      TEST_DOMAIN: test.e-mail-check.de
      MX_HOSTNAME: mx.e-mail-check.de
      SMTP_PORT: "2525"
      HTTP_PORT: "8787"
      RSPAMD_URL: http://rspamd:11333
      DNS_SERVERS: 172.28.0.53
      # Local only: lets swaks simulate a real sender IP. Never in production.
      ALLOW_XCLIENT: "1"
      # The API is only reached through Caddy, which sets X-Forwarded-For.
      TRUST_PROXY: "1"
    volumes:
      - data:/data
    ports:
      - "2525:2525"
    depends_on: [unbound, rspamd]
    networks: [mail]
    # Hardened: no capabilities, no privilege escalation, read-only image (only /data and /tmp writable).
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on: [engine]
    networks: [mail]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

  # Cookie-free statistics, off by default: `docker compose --profile stats up`
  umami-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [stats]
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-local-only-change-me}
    volumes:
      - umami-db:/var/lib/postgresql/data
    networks: [mail]

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    profiles: [stats]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-local-only-change-me}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-local-only-change-me}
      DISABLE_TELEMETRY: "1"
    depends_on: [umami-db]
    # Local only: the Umami UI on localhost:3000. Production publishes no port (docker-compose.prod.yml).
    ports:
      - "127.0.0.1:3000:3000"
    networks: [mail]
