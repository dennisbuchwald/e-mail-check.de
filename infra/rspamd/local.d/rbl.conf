# Privacy: only link-domain lists stay on (Spamhaus DBL, SURBL, URIBL). They receive domains
# linked in the mail, nothing else. Sender IPs are checked by the engine itself (reputation.ts);
# hashed mail addresses and rspamd's own lists are off.
rbls {
  spamhaus { enabled = false; }
  mailspike { enabled = false; }
  sem { enabled = false; }
  semIPv6 { enabled = false; }
  dnswl { enabled = false; }
  dnswl_dwl { enabled = false; }
  virusfree { enabled = false; }
  blocklistde { enabled = false; }
  RSPAMD_EMAILBL { enabled = false; }
  MSBL_EBL { enabled = false; }
  SURBL_HASHBL { enabled = false; }
  RSPAMD_URIBL { enabled = false; }
  SEM_URIBL_UNKNOWN { enabled = false; }
  SEM_URIBL_FRESH15_UNKNOWN { enabled = false; }
}
