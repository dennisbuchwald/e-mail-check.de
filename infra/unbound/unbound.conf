# Own recursive resolver. Blocklists (Spamhaus etc.) refuse queries via public resolvers.
server:
  interface: 0.0.0.0
  port: 53
  do-ip6: no
  access-control: 0.0.0.0/0 refuse
  access-control: 127.0.0.0/8 allow
  access-control: 10.0.0.0/8 allow
  access-control: 172.16.0.0/12 allow
  access-control: 192.168.0.0/16 allow
  trust-anchor-file: /usr/share/dnssec-root/trusted-key.key
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  prefetch: yes
  cache-max-ttl: 3600
  # Blocklist answers should not be cached long.
  cache-max-negative-ttl: 300
  username: "unbound"
  chroot: ""
  logfile: ""
  verbosity: 0
  so-sndbuf: 0
